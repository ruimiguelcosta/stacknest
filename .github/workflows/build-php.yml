name: Build PHP runtimes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PHP_VERSION: ${{ matrix.php }}
      EXTENSIONS: bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gmp,iconv,imagick,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib
    steps:
      - name: Install spc
        run: |
          curl -fsSL -o spc https://dl.static-php.dev/v3/spc-bin/nightly/spc-macos-aarch64
          chmod +x spc
          ./spc --version

      - name: Prepare build tools
        run: |
          for attempt in 1 2 3 4 5; do
            ./spc doctor --auto-fix && exit 0
            sleep 20
          done
          exit 1

      - name: Build PHP
        run: >
          ./spc build:php "$EXTENSIONS"
          --build-cli --build-fpm --build-shared=xdebug
          --with-packages=freetype,libjpeg,libwebp
          --dl-with-php="$PHP_VERSION"
          --dl-retry=5
          --no-smoke-test

      - name: Verify modules
        run: |
          buildroot/bin/php-fpm -m > modules.txt
          cat modules.txt
          for module in "Zend OPcache" mysqli pdo_mysql pdo_pgsql pgsql pdo_sqlite redis intl gd gmp imagick soap xsl sodium zip; do
            grep -qix "$module" modules.txt || { echo "Missing module: $module"; exit 1; }
          done
          buildroot/bin/php -r 'exit(function_exists("mb_split") ? 0 : 1);'
          so=$(find buildroot -name xdebug.so -print -quit)
          if [ -n "$so" ] && buildroot/bin/php -n -d "zend_extension=$PWD/$so" -m 2>&1 | tee xdebug.txt | grep -qix xdebug; then
            echo "XDEBUG_SO=$so" >> "$GITHUB_ENV"
          else
            echo "::warning title=Xdebug not packaged::PHP $PHP_VERSION could not load xdebug.so"
            cat xdebug.txt
          fi

      - name: Package
        run: |
          full=$(buildroot/bin/php -r 'echo PHP_VERSION;')
          mkdir -p runtime/bin runtime/lib dist
          cp buildroot/bin/php buildroot/bin/php-fpm runtime/bin/
          if [ -n "${XDEBUG_SO:-}" ]; then cp "$XDEBUG_SO" runtime/lib/; fi
          tar -czf "dist/php-$full-macos-aarch64.tar.gz" -C runtime bin lib

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}-macos-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-php-${{ matrix.php }}
          path: log/
          if-no-files-found: ignore
